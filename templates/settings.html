{% extends "base.html" %}

{% block title %}settings — jobalign ai{% endblock %}

{% block content %}
<div class="dashboard-layout">
  {% with active_page='settings' %}
    {% include "components/sidebar.html" %}
  {% endwith %}

  <main class="dashboard-main">
    <div class="dashboard-header">
      <h1 class="dashboard-title">account settings</h1>
      <p class="dashboard-subtitle">manage your security settings and account credentials.</p>
    </div>

    <div style="max-width: 600px;">
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">security & password</h2>
        </div>

        <form method="POST" action="{{ url_for('dashboard.settings_view') }}">
          <div class="form-group">
            <label class="form-label" for="current_password">current password</label>
            <input type="password" id="current_password" name="current_password" class="form-control" placeholder="enter your current password" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="new_password">new password</label>
            <input type="password" id="new_password" name="new_password" class="form-control" placeholder="at least 6 characters" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm_password">confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="repeat new password" required>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">update password</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
{% endblock %}
