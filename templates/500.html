{% extends "base.html" %}

{% block title %}server error — jobalign ai{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="card" style="text-align: center; max-width: 480px; padding: 3rem 2rem;">
    <div style="font-size: 3.5rem; font-weight: 800; color: var(--danger); margin-bottom: 0.5rem;">500</div>
    <h1 class="panel-title" style="font-size: 1.4rem; margin-bottom: 0.75rem;">internal server error</h1>
    <p class="card-desc" style="margin-bottom: 1.75rem;">
      an unexpected issue occurred while processing your request. our team has been notified.
    </p>
    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <a href="{{ url_for('index') }}" class="btn btn-primary">return home</a>
      <a href="{{ url_for('dashboard.dashboard_view') }}" class="btn btn-secondary">go to dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
